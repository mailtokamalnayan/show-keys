<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: rgb(0 0 0 / 0.08);
    --track: #d2d2d7; --on: #1a7f37; --preview-bg: #f2f2f4;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #2c2c2e;
      --track: #3a3a3c; --on: #30a14e; --preview-bg: #2c2c2e;
    }
  }
  body {
    margin: 0; padding: 16px; width: 240px; background: var(--bg); color: var(--fg);
    font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; gap: 16px;
  }
  hr { margin: 0; border: 0; border-top: 1px solid var(--line); }
  .visually-hidden { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }

  /* On/off switch */
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  .text { display: flex; flex-direction: column; gap: 4px; }
  .title { font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; line-height: 16px; }
  .switch {
    flex: none; position: relative; width: 40px; height: 24px; border-radius: 12px;
    background: var(--track);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.2), 0 1px 1px rgb(0 0 0 / 0.1);
  }
  input:checked + .switch { background: var(--on); }
  input:checked + .switch::after { transform: translateX(16px); }
  input:focus-visible + .switch { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* Theme picker */
  fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  legend { padding: 0; margin-bottom: 8px; font-weight: 600; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .preview {
    box-sizing: border-box; width: 100%; height: 64px; border-radius: 12px;
    background: var(--preview-bg); display: grid; place-items: center;
    box-shadow: 0 0 0 1px var(--line);
  }
  .preview .key {
    width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center;
    font: 18px/1 "Berkeley Mono", ui-monospace, Menlo, monospace;
  }
  .name { font-size: 12px; line-height: 16px; color: var(--muted); }
  input:checked + .preview { box-shadow: 0 0 0 2px var(--fg); }
  input:checked ~ .name { color: var(--fg); }
  input:focus-visible + .preview { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* Turn on motion only after the saved state loads, so nothing slides on open. */
  .ready .switch { transition: background-color 150ms var(--ease); }
  .ready .switch::after { transition: transform 150ms var(--ease); }
  .ready .preview { transition: box-shadow 150ms var(--ease); }
  @media (prefers-reduced-motion: reduce) {
    .ready .switch, .ready .switch::after, .ready .preview { transition: none; }
  }
</style>
<style id="theme-css"></style>
</head>
<body>
  <label class="setting" for="toggle">
    <span class="text">
      <span class="title">Show pressed keys</span>
      <span class="hint">Keys show at the bottom center of each page.</span>
    </span>
    <input type="checkbox" id="toggle" role="switch" class="visually-hidden">
    <span class="switch" aria-hidden="true"></span>
  </label>
  <hr>
  <fieldset>
    <legend>Theme</legend>
    <div class="themes">
      <label class="theme">
        <input type="radio" name="theme" value="flat" class="visually-hidden">
        <span class="preview" data-theme="flat" aria-hidden="true"><span class="key">K</span></span>
        <span class="name">Flat</span>
      </label>
      <label class="theme">
        <input type="radio" name="theme" value="skeuomorphic" class="visually-hidden">
        <span class="preview" data-theme="skeuomorphic" aria-hidden="true"><span class="key">K</span></span>
        <span class="name">Skeuomorphic</span>
      </label>
      <label class="theme">
        <input type="radio" name="theme" value="neon" class="visually-hidden">
        <span class="preview" data-theme="neon" aria-hidden="true"><span class="key">K</span></span>
        <span class="name">Neon</span>
      </label>
    </div>
  </fieldset>
  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
