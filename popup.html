<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73;
    --track: #d2d2d7; --on: #1a7f37;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --track: #3a3a3c; --on: #30a14e; }
  }
  body {
    margin: 0; padding: 16px; width: 240px; background: var(--bg); color: var(--fg);
    font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  label { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; }
  .text { display: flex; flex-direction: column; gap: 4px; }
  .title { font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; line-height: 16px; }
  input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch {
    flex: none; position: relative; width: 40px; height: 24px; border-radius: 12px;
    background: var(--track);
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 1px 1px rgba(0,0,0,0.1);
  }
  /* Turn on motion only after the saved state loads, so the switch does not slide on open. */
  .ready .switch { transition: background-color 150ms var(--ease); }
  .ready .switch::after { transition: transform 150ms var(--ease); }
  input:checked + .switch { background: var(--on); }
  input:checked + .switch::after { transform: translateX(16px); }
  input:focus-visible + .switch { outline: 2px solid var(--fg); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .ready .switch, .ready .switch::after { transition: none; } }
</style>
</head>
<body>
  <label for="toggle">
    <span class="text">
      <span class="title">Show pressed keys</span>
      <span class="hint">Keys show at the bottom center of each page.</span>
    </span>
    <input type="checkbox" id="toggle" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
