<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Show Keys scene</title>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
    --mono: "Berkeley Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    background: var(--stage); color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
  }

  /* Caption */
  .caption { padding: 48px 0 40px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .caption h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; }
  .caption p { margin: 0; font-size: 18px; line-height: 24px; color: var(--ink-muted); }

  /* App window */
  .window {
    width: 1120px; flex: 1; border-radius: 16px 16px 0 0; overflow: hidden;
    background: var(--win); display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px var(--win-line), 0 8px 24px rgb(0 0 0 / 0.08), 0 24px 64px rgb(0 0 0 / 0.12);
  }
  .bar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--win-line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
  .bar .title { margin-left: 16px; font-size: 13px; color: var(--ink-muted); }
  .body { flex: 1; display: flex; min-height: 0; }

  /* Doc scene: light page, flat keys */
  body.doc { --stage: #ece9e4; --ink: #1d1d1f; --ink-muted: #6e6e73; --win: #fff; --win-line: rgb(0 0 0 / 0.08); --dot: #d9d6d0; }
  .doc .side { width: 240px; padding: 24px 16px; border-right: 1px solid var(--win-line); background: #faf9f7; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .doc .side div { padding: 4px 8px; border-radius: 6px; color: #3a3a3c; }
  .doc .side .on { background: rgb(0 0 0 / 0.05); font-weight: 600; }
  .doc .page { flex: 1; padding: 48px 96px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; }
  .doc h2 { margin: 0 0 8px; font-size: 32px; line-height: 40px; letter-spacing: -0.01em; }
  .doc .page p { margin: 0; font-size: 16px; line-height: 26px; color: #3a3a3c; }
  .doc mark { background: #fff1b8; color: inherit; font-weight: 700; padding: 0 2px; }

  /* Code scene: dark editor, light keys */
  body.code { --stage: #1b1d23; --ink: #f5f5f7; --ink-muted: #98989d; --win: #24262e; --win-line: #33363f; --dot: #3d404a; }
  .code .tree { width: 224px; padding: 16px; border-right: 1px solid var(--win-line); font: 13px/24px var(--mono); color: #9da1ab; }
  .code .tree .on { color: #f5f5f7; }
  .code .editor { flex: 1; position: relative; padding: 16px 0; font: 14px/24px var(--mono); color: #d6d9e0; }
  .code .ln { display: flex; }
  .code .ln > span:first-child { width: 56px; padding-right: 16px; text-align: right; color: #565a66; flex: none; }
  .k { color: #c792ea; } .s { color: #c3e88d; } .f { color: #82aaff; } .c { color: #676e7b; } .n { color: #f78c6c; }
  .palette {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 560px;
    background: #2d3039; border-radius: 12px; overflow: hidden; font-family: var(--sans);
    box-shadow: 0 0 0 1px #3d404a, 0 8px 24px rgb(0 0 0 / 0.3), 0 24px 48px rgb(0 0 0 / 0.3);
  }
  .palette .q { padding: 16px; font-size: 15px; color: #f5f5f7; border-bottom: 1px solid #3d404a; }
  .palette .q span { color: #8a8f9c; }
  .palette .item { padding: 8px 16px; font-size: 14px; line-height: 24px; color: #c9ccd3; display: flex; justify-content: space-between; }
  .palette .item.on { background: #3b4050; color: #fff; }
  .palette .item kbd { font: 12px var(--mono); color: #8a8f9c; }

  /* Slides scene: dark stage, neon keys */
  body.slides { --stage: #07080d; --ink: #f5f5f7; --ink-muted: #8b8fa3; --win: #10121b; --win-line: #1f2333; --dot: #262a3b; }
  .slides .thumbs { width: 200px; padding: 16px; border-right: 1px solid var(--win-line); display: flex; flex-direction: column; gap: 16px; }
  .slides .thumb { height: 96px; border-radius: 8px; background: #181b28; box-shadow: 0 0 0 1px #262a3b; }
  .slides .thumb.on { box-shadow: 0 0 0 2px #00e5ff; }
  .slides .canvas { flex: 1; display: grid; place-items: start center; padding: 40px; }
  .slides .slide {
    width: 760px; height: 400px; border-radius: 12px; padding: 56px; background: linear-gradient(160deg, #161a2b, #0c0e17);
    box-shadow: 0 0 0 1px #262a3b; display: flex; flex-direction: column; gap: 16px;
  }
  .slides .slide small { font: 13px var(--mono); letter-spacing: 0.08em; color: #00e5ff; text-transform: uppercase; }
  .slides .slide h3 { margin: 0; font-size: 44px; line-height: 52px; letter-spacing: -0.02em; font-weight: 650; max-width: 560px; }
  .slides .slide p { margin: 0; font-size: 18px; line-height: 28px; color: #8b8fa3; max-width: 520px; }

  /* Popup scene */
  body.popup { --stage: #ece9e4; --ink: #1d1d1f; --ink-muted: #6e6e73; }
  .popup .stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; gap: 64px; padding-top: 8px; }
  .popup .shot { border-radius: 16px; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08), 0 8px 24px rgb(0 0 0 / 0.08), 0 24px 64px rgb(0 0 0 / 0.14); }
  .popup .notes { width: 320px; display: flex; flex-direction: column; gap: 24px; padding-top: 32px; }
  .popup .note { display: flex; flex-direction: column; gap: 4px; }
  .popup .note b { font-size: 18px; line-height: 24px; }
  .popup .note span { font-size: 16px; line-height: 24px; color: var(--ink-muted); }
  /* Promo tiles: the name and the icon, with the real keys under them */
  .promo { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { display: block; margin: -8px; }
  .brand b { font-size: 32px; line-height: 40px; font-weight: 650; letter-spacing: -0.02em; }
  body.tile { --stage: #ece9e4; --ink: #1d1d1f; --ink-muted: #6e6e73; }
  .tile .promo { padding-top: 40px; }
  .tile .brand img { width: 64px; height: 64px; }
  body.marquee { --stage: radial-gradient(120% 140% at 50% 0%, #2a2d36, #121318 70%); --ink: #f5f5f7; --ink-muted: #a1a4ad; }
  .marquee .promo { padding-top: 32px; gap: 8px; }
  .marquee .brand img { width: 56px; height: 56px; }
  .marquee .promo p { margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted); }
</style>
</head>
<body>
<script>
  const scene = new URLSearchParams(location.search).get("scene") || "doc";
  document.body.className = scene;
  // Page size in CSS pixels. The marquee renders at 2x, so 700 x 280 becomes 1400 x 560.
  const SIZES = { tile: [440, 280], marquee: [700, 280] };
  const [w, h] = SIZES[scene] || [1280, 800];
  for (const el of [document.documentElement, document.body]) Object.assign(el.style, { width: w + "px", height: h + "px" });
  const bar = (title) => `<div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="title">${title}</div></div>`;
  const caption = (h, p) => `<div class="caption"><h1>${h}</h1><p>${p}</p></div>`;
  const ln = (n, html) => `<div class="ln"><span>${n}</span><span>${html}</span></div>`;

  const scenes = {
    doc: caption("See each shortcut as you press it", "Made for screen recordings, demos, and tutorials.") + `
      <div class="window">${bar("Launch notes")}<div class="body">
        <div class="side"><div>Inbox</div><div class="on">Launch notes</div><div>Roadmap</div><div>Meeting notes</div><div>Design review</div><div>Archive</div></div>
        <div class="page">
          <h2>Launch notes</h2>
          <p>We ship the new editor on Thursday. The team records a short demo for the launch post, and each step must be easy to follow.</p>
          <p>Viewers must see the <mark>keyboard shortcuts</mark> in the video. When the presenter presses a shortcut, the keys show at the bottom of the screen.</p>
          <p>Record the demo at 1280 × 800, and keep each clip under two minutes.</p>
        </div>
      </div></div>`,

    code: caption("Shortcuts show as one group", "Modifiers show in Mac order: ⌃ ⌥ ⇧ ⌘.") + `
      <div class="window">${bar("app.ts — editor")}<div class="body">
        <div class="tree"><div>src</div><div>&nbsp; components</div><div class="on">&nbsp; app.ts</div><div>&nbsp; keys.ts</div><div>&nbsp; theme.ts</div><div>package.json</div></div>
        <div class="editor">
          ${ln(1, `<span class="k">import</span> { createApp } <span class="k">from</span> <span class="s">"./core"</span>;`)}
          ${ln(2, `<span class="k">import</span> { theme } <span class="k">from</span> <span class="s">"./theme"</span>;`)}
          ${ln(3, ``)}
          ${ln(4, `<span class="c">// Start the app with the saved theme.</span>`)}
          ${ln(5, `<span class="k">export async function</span> <span class="f">start</span>() {`)}
          ${ln(6, `&nbsp;&nbsp;<span class="k">const</span> app = <span class="f">createApp</span>({ theme, port: <span class="n">4310</span> });`)}
          ${ln(7, `&nbsp;&nbsp;<span class="k">await</span> app.<span class="f">listen</span>();`)}
          ${ln(8, `&nbsp;&nbsp;<span class="k">return</span> app;`)}
          ${ln(9, `}`)}
          ${ln(10, ``)}
          ${ln(11, `<span class="f">start</span>();`)}
          <div class="palette">
            <div class="q">&gt; format<span>|</span></div>
            <div class="item on">Format Document<kbd>⌥⇧F</kbd></div>
            <div class="item">Format Selection<kbd>⌘K ⌘F</kbd></div>
            <div class="item">Format Document With…</div>
          </div>
        </div>
      </div></div>`,

    slides: caption("Pick from three key styles", "Flat, Skeuomorphic, or Neon. Change the style from the toolbar icon.") + `
      <div class="window">${bar("Keynote — Shortcuts 101")}<div class="body">
        <div class="thumbs"><div class="thumb"></div><div class="thumb on"></div><div class="thumb"></div></div>
        <div class="canvas"><div class="slide">
          <small>Lesson 2</small>
          <h3>Copy and paste without the mouse</h3>
          <p>Press ⌘ C to copy and ⌘ V to paste. Watch the keys at the bottom of the screen.</p>
        </div></div>
      </div></div>`,

    popup: caption("Turn it on with one click", "Click the toolbar icon to show or hide the keys on each page.") + `
      <div class="stage">
        <img class="shot" src="popup.png" width="544">
        <div class="notes">
          <div class="note"><b>Works on each site</b><span>The keys show on each page you open, also in embedded frames.</span></div>
          <div class="note"><b>Private by design</b><span>No data leaves your computer. Keys in password fields never show.</span></div>
          <div class="note"><b>Stays out of the way</b><span>The keys go away 1.5 seconds after your last key press.</span></div>
        </div>
      </div>`,

    tile: `<div class="promo"><div class="brand"><img src="icon.png" alt=""><b>Show Keys</b></div></div>`,

    marquee: `<div class="promo"><div class="brand"><img src="icon.png" alt=""><b>Show Keys</b></div>
      <p>See each key you press, on each page.</p></div>`,
  };
  document.body.innerHTML = scenes[scene];
</script>
</body>
</html>
